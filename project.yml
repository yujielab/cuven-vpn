name: Cuven
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Cuven:
    type: application
    platform: iOS
    sources:
      - path: ios/App
        excludes:
          - PrivacyInfo.xcprivacy
      - path: ios/App/PrivacyInfo.xcprivacy
        buildPhase: resources
      - ios/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cuven.vpn
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ios/Generated/Cuven-Info.plist
      properties:
        CFBundleDisplayName: Cuven
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CuvenCredentialStorageVersion: 2
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: ios/Generated/Cuven.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    dependencies:
      - target: CuvenTunnel
        embed: true
        link: false
      - sdk: NetworkExtension.framework

  CuvenTunnel:
    type: app-extension
    platform: iOS
    sources:
      - ios/Tunnel
      - ios/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cuven.vpn.tunnel
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: ios/Generated/CuvenTunnel-Info.plist
      properties:
        CFBundleDisplayName: Cuven Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CuvenCredentialStorageVersion: 2
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: ios/Generated/CuvenTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    dependencies:
      - framework: Vendor/CuvenCore.xcframework
        embed: false
      - sdk: NetworkExtension.framework

  CuvenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ios/Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cuven.vpn.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Cuven

  CuvenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ios/UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cuven.vpn.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Cuven
    dependencies:
      - target: Cuven

schemes:
  Cuven:
    build:
      targets:
        Cuven: all
        CuvenTests: [test]
        CuvenUITests: [test]
    test:
      targets:
        - CuvenTests
        - CuvenUITests
