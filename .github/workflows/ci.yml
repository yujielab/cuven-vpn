name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Install Hysteria 2 for interoperability tests
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            -o hysteria https://github.com/HyNetworks/hysteria/releases/download/app/v2.14.0/hysteria-linux-amd64
          echo 'fc25edff9948708cb00a4ff01f3bccde677660aca050133bb1ad46c6860362d2  hysteria' | sha256sum -c
          chmod +x hysteria
          echo "CUVEN_HYSTERIA_BIN=$PWD/hysteria" >> "$GITHUB_ENV"
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/cuven-wg-relay

  ios:
    name: iOS 27.2 build and tests
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Install XcodeGen
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip
          echo 'a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73  xcodegen.zip' | shasum -a 256 -c
          unzip -q xcodegen.zip
          echo "$PWD/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate the Xcode project
        run: |
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = 27.2
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = 27.2
          ./scripts/build-core.sh
          xcodegen generate
      - name: Build iOS app and embedded packet tunnel
        run: |
          xcodebuild -project Cuven.xcodeproj -scheme Cuven -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO -quiet build
          test -d DerivedData/Build/Products/Release-iphoneos/Cuven.app/PlugIns/CuvenTunnel.appex
          plutil -lint DerivedData/Build/Products/Release-iphoneos/Cuven.app/PrivacyInfo.xcprivacy
      - name: Run iPhone Duo and iPhone 17 simulator tests
        run: |
          xcodebuild -project Cuven.xcodeproj -scheme Cuven -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone Duo,OS=27.2' \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.2' \
            -derivedDataPath DerivedData -maximum-concurrent-test-simulator-destinations 1 \
            CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO -quiet test
