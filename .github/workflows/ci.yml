name: Cuven IPA

on:
  push:
    branches: [codex/ipa-2879ea4]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Install XcodeGen
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip
          echo 'a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73  xcodegen.zip' | shasum -a 256 -c
          unzip -q xcodegen.zip
          echo "$PWD/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate the Xcode project
        run: |
          xcodebuild -version
          ./scripts/build-core.sh
          xcodegen generate
      - name: Build iOS app and embedded packet tunnel
        run: |
          xcodebuild -project Cuven.xcodeproj -scheme Cuven -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO -quiet build
          test -d DerivedData/Build/Products/Release-iphoneos/Cuven.app/PlugIns/CuvenTunnel.appex
      - name: Package unsigned IPA
        run: |
          ./scripts/package-unsigned-ipa.sh DerivedData/Build/Products/Release-iphoneos/Cuven.app build/Cuven-2879ea4-unsigned.ipa
          (cd build && shasum -a 256 Cuven-2879ea4-unsigned.ipa > Cuven-2879ea4-unsigned.ipa.sha256)
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Cuven-2879ea4-unsigned-ipa
          path: build/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
