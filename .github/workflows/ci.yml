name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/cuven-gateway

  ios:
    name: iOS 27.2 tests on ${{ matrix.device }}
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone Duo, iPhone 17]
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Install XcodeGen
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip
          echo 'a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73  xcodegen.zip' | shasum -a 256 -c
          unzip -q xcodegen.zip
          echo "$PWD/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate the Xcode project
        run: |
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = 27.2
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = 27.2
          ./scripts/build-core.sh
          xcodegen generate
      - name: Build iOS app and embedded packet tunnel
        if: matrix.device == 'iPhone Duo'
        run: |
          xcodebuild -project Cuven.xcodeproj -scheme Cuven -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO -quiet build
          test -d DerivedData/Build/Products/Release-iphoneos/Cuven.app/PlugIns/CuvenTunnel.appex
          plutil -lint DerivedData/Build/Products/Release-iphoneos/Cuven.app/PrivacyInfo.xcprivacy
      - name: Build the simulator app and tests
        run: |
          xcodebuild -project Cuven.xcodeproj -scheme Cuven -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY=- -quiet build-for-testing
      - name: Boot the selected iOS 27.2 simulator
        timeout-minutes: 6
        env:
          SIMULATOR_MODEL: ${{ matrix.device }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import subprocess

          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          runtime = devices["devices"].get("com.apple.CoreSimulator.SimRuntime.iOS-27-2", [])
          matches = [device for device in runtime if device["name"] == os.environ["SIMULATOR_MODEL"]]
          if len(matches) != 1:
              raise SystemExit(f"Expected one {os.environ['SIMULATOR_MODEL']} on iOS 27.2, found {len(matches)}")
          udid = matches[0]["udid"]
          subprocess.run(["xcrun", "simctl", "bootstatus", udid, "-b"], check=True, timeout=300)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"SIMULATOR_ID={udid}\n")
          PYTHON
      - name: Install and launch Cuven independently of XCTest
        timeout-minutes: 3
        run: |
          xcrun simctl install "$SIMULATOR_ID" DerivedData/Build/Products/Debug-iphonesimulator/Cuven.app
          xcrun simctl launch "$SIMULATOR_ID" dev.cuven.vpn
          xcrun simctl terminate "$SIMULATOR_ID" dev.cuven.vpn
      - name: Run unit and layout tests on the booted device
        timeout-minutes: 12
        run: |
          xcodebuild -project Cuven.xcodeproj -scheme Cuven -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath DerivedData \
            -parallel-testing-enabled NO -quiet test-without-building
