name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite
        type: choice
        options: [all, gateway]
        default: all

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ inputs.suite == 'gateway' && '-gateway' || '' }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/cuven-gateway
      - name: Run the gateway under systemd in a private network
        run: |
          if ! command -v nft >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends nftables
          fi
          go build -o "$RUNNER_TEMP/cuven-test-client" ../scripts/tests/gateway-client.go
          sudo bash ../scripts/tests/test-gateway-systemd.sh ./cuven-gateway "$RUNNER_TEMP/cuven-test-client"
      - name: Check gateway certificate validity and TLS identity
        run: bash ../scripts/tests/test-certificate-dates.sh ./cuven-gateway
      - name: Test the Certbot renewal hook in a temporary filesystem
        run: |
          docker run --rm --read-only --network none --tmpfs /etc:exec --tmpfs /tmp:exec \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            ubuntu:24.04@sha256:562111b88caa79c71391c0c4d3c2114a7d5c35915c20561fd893cb1e07929e6b \
            bash /src/scripts/tests/test-certbot-hook.sh

  ios:
    if: github.event_name != 'workflow_dispatch' || inputs.suite != 'gateway'
    name: iOS 27.2 tests on ${{ matrix.device }}
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone Duo, iPhone 17]
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Install XcodeGen
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip
          echo 'a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73  xcodegen.zip' | shasum -a 256 -c
          unzip -q xcodegen.zip
          echo "$PWD/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate the Xcode project
        run: |
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = 27.2
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = 27.2
          ./scripts/build-core.sh
          xcodegen generate
      - name: Build iOS app and embedded packet tunnel
        if: matrix.device == 'iPhone Duo'
        run: |
          xcodebuild -project Cuven.xcodeproj -scheme Cuven -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO -quiet build
          test -d DerivedData/Build/Products/Release-iphoneos/Cuven.app/PlugIns/CuvenTunnel.appex
          plutil -lint DerivedData/Build/Products/Release-iphoneos/Cuven.app/PrivacyInfo.xcprivacy
      - name: Build the simulator app and tests
        run: |
          xcodebuild -project Cuven.xcodeproj -scheme Cuven -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY=- -quiet build-for-testing
      - name: Boot the selected iOS 27.2 simulator
        timeout-minutes: 6
        env:
          SIMULATOR_MODEL: ${{ matrix.device }}
        run: |
          device_id=$(python3 scripts/select-ios-simulator.py "$SIMULATOR_MODEL" 27.2)
          echo "Selected $SIMULATOR_MODEL ($device_id)"
          xcrun simctl bootstatus "$device_id" -b
          echo "SIMULATOR_ID=$device_id" >> "$GITHUB_ENV"
      - name: Install Cuven on the booted simulator
        timeout-minutes: 12
        run: python3 scripts/install-simulator-app.py DerivedData/Build/Products/Debug-iphonesimulator/Cuven.app
      - name: Launch Cuven independently of XCTest
        timeout-minutes: 3
        run: xcrun simctl launch "$SIMULATOR_ID" dev.cuven.vpn
      - name: Terminate Cuven before XCTest
        timeout-minutes: 3
        run: xcrun simctl terminate "$SIMULATOR_ID" dev.cuven.vpn
      - name: Run unit and layout tests on the booted device
        id: simulator_tests
        timeout-minutes: 12
        run: |
          xcodebuild -project Cuven.xcodeproj -scheme Cuven -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath DerivedData \
            -resultBundlePath "$RUNNER_TEMP/CuvenSimulator.xcresult" \
            -parallel-testing-enabled NO -quiet test-without-building
      - name: Show failed simulator assertions
        if: failure() && steps.simulator_tests.outcome == 'failure'
        run: |
          result="$RUNNER_TEMP/CuvenSimulator.xcresult"
          if [[ -d "$result" ]]; then
            xcrun xcresulttool get test-results summary --path "$result" |
              python3 -c 'import json, sys
          for failure in json.load(sys.stdin).get("testFailures", []):
              print(failure.get("testName", ""), failure.get("failureText", ""))'
          fi
      - name: Read unit and rotation test results
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import subprocess

          bundle = os.path.join(os.environ["RUNNER_TEMP"], "CuvenSimulator.xcresult")
          def read_results(kind):
              return json.loads(subprocess.check_output(
                  ["xcrun", "xcresulttool", "get", "test-results", kind, "--path", bundle]
              ))

          summary = read_results("summary")
          if not summary.get("passedTests") or summary.get("failedTests") != 0:
              raise SystemExit("Expected completed, passing simulator tests")
          nodes = list(read_results("tests")["testNodes"])
          keychain_test = "SimulatorKeychainTests/testAppCredentialFollowsSystemKeychainGrant()"
          expected = {
              keychain_test,
              "SimulatorKeychainTests/testSavedReferenceReadsAndRemovesOnlyTheSelectedCredential()",
              "SimulatorKeychainTests/testNonCredentialReferencesLeaveTheOriginalItemsIntact()",
              "ConnectionLayoutTests/testConnectionSettingsStayReachableAfterRotation()",
              "VPNProfileTests/testIPv4OnlyCuvenDropsCapturedIPv6BeforeForwarding()",
          }
          while nodes:
              node = nodes.pop()
              nodes.extend(node.get("children", []))
              if node.get("result") == "Passed":
                  expected.discard(node.get("nodeIdentifier"))
          if expected:
              raise SystemExit(f"Missing passing simulator tests: {sorted(expected)}")
          activities = subprocess.check_output(
              ["xcrun", "xcresulttool", "get", "test-results", "activities", "--path", bundle,
               "--test-id", keychain_test], text=True
          )
          outcomes = [label for label in (
              "Cuven app keychain round trip", "Cuven app keychain entitlement denied",
              "Cuven app keychain group unconfirmed",
          ) if label in activities]
          if len(outcomes) != 1:
              raise SystemExit("Could not identify the system keychain result in the test activity")
          line = f"{summary['passedTests']} tests passed, including rotation and IPv4-only tunnel coverage. {outcomes[0]}."
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              print(line, file=output)
          PYTHON
